# Compila o XCL em modo release num runner Windows do GitHub e publica
# xcl.exe (+ DXC) como artefato para download.
name: Build XCL (release)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      - name: Rust (stable, MSVC)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable-x86_64-pc-windows-msvc
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ runner.os }}-

      - name: Build
        run: cargo build --release --workspace

      - name: Montar pacote
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\xcl.exe dist\
          Copy-Item target\release\xcl.pdb dist\ -ErrorAction SilentlyContinue

          # DXC recente (o README recomenda 1.8+), colocado ao lado do xcl.exe
          gh release download --repo microsoft/DirectXShaderCompiler --pattern "dxc_*.zip" --dir dxc
          $zip = Get-ChildItem dxc\*.zip | Where-Object { $_.Name -notmatch 'pdb' } | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath dxc\x
          Copy-Item dxc\x\bin\x64\dxcompiler.dll, dxc\x\bin\x64\dxil.dll dist\

          Copy-Item README.md, LICENSE, THIRD_PARTY.md dist\
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: xcl-windows-x64
          path: dist/
